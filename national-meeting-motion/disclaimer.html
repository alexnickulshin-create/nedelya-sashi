<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дисклеймер · Ветер перемен</title>
<style>
  /* Century Gothic: берётся из системы или из fonts/ (CenturyGothic.ttf, CenturyGothic-Bold.ttf).
     Если его нет — URW Gothic, метрический аналог (Avant Garde) с кириллицей. */
  @font-face { font-family: Brand; font-weight: 400; src: local('Century Gothic'), local('CenturyGothic'), url(fonts/CenturyGothic.ttf), url(fonts/GOTHIC.TTF), url(fonts/URWGothic-Book.otf); }
  @font-face { font-family: Brand; font-weight: 700; src: local('Century Gothic Bold'), local('CenturyGothic-Bold'), url(fonts/CenturyGothic-Bold.ttf), url(fonts/GOTHICB.TTF), url(fonts/URWGothic-Demi.otf); }

  :root { --navy: #14233c; --cobalt: #2f4fe0; --muted: #5d6b85; }
  html, body { margin: 0; background: #f5f7fc; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Brand, sans-serif; color: var(--navy); }
  canvas { position: absolute; inset: 0; }
  .layer { position: absolute; left: 150px; will-change: transform, filter, opacity; }

  #kicker { top: 168px; font-size: 25px; font-weight: 700; letter-spacing: .22em; color: var(--cobalt); text-transform: uppercase; }
  #icons { top: 250px; display: flex; gap: 26px; }
  #icons svg { width: 112px; height: 112px; overflow: visible; }
  .h { font-size: 112px; font-weight: 700; line-height: 1.0; letter-spacing: -0.02em; }
  .mask { position: absolute; left: 140px; overflow: hidden; padding: 0 10px 14px; }
  #body { top: 718px; font-size: 40px; font-weight: 400; line-height: 1.32; color: var(--navy); }
  #en { top: 846px; font-size: 26px; font-weight: 400; letter-spacing: .04em; color: var(--muted); }
  #sign { top: 952px; display: flex; align-items: center; gap: 28px; }
  #sign .w { font-size: 34px; font-weight: 700; letter-spacing: -.005em; }
  #sign .bar { width: 2px; height: 42px; background: var(--navy); opacity: .25; }
  #logo { height: 58px; width: auto; display: block; }
  #sign .ldb { font-size: 17px; font-weight: 400; letter-spacing: .26em; line-height: 1.35; }
  #sign .ldb b { font-weight: 700; letter-spacing: .2em; font-size: 22px; display: block; }
  #rule { top: 666px; left: 150px; height: 6px; width: 120px; background: var(--cobalt); border-radius: 3px; transform-origin: left center; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>

  <div class="layer" id="kicker">National Meeting LDB · 16–17 декабря</div>

  <div class="layer" id="icons">
    <!-- фото -->
    <svg viewBox="0 0 112 112" fill="none">
      <circle cx="56" cy="56" r="52" stroke="#14233c" stroke-width="4" class="ring" pathLength="1" stroke-dasharray="1" />
      <g stroke="#14233c" stroke-width="4" stroke-linejoin="round" class="glyph">
        <path d="M30 44h12l5-7h18l5 7h12v32H30z" />
        <circle cx="56" cy="60" r="10" />
      </g>
      <line x1="22" y1="90" x2="90" y2="22" stroke="#2f4fe0" stroke-width="7" stroke-linecap="round" class="slash" pathLength="1" stroke-dasharray="1" />
    </svg>
    <!-- видео -->
    <svg viewBox="0 0 112 112" fill="none">
      <circle cx="56" cy="56" r="52" stroke="#14233c" stroke-width="4" class="ring" pathLength="1" stroke-dasharray="1" />
      <g stroke="#14233c" stroke-width="4" stroke-linejoin="round" class="glyph">
        <rect x="27" y="40" width="42" height="32" rx="5" />
        <path d="M69 52l16-9v26l-16-9z" />
      </g>
      <line x1="22" y1="90" x2="90" y2="22" stroke="#2f4fe0" stroke-width="7" stroke-linecap="round" class="slash" pathLength="1" stroke-dasharray="1" />
    </svg>
  </div>

  <div class="mask" style="top:392px"><div class="h" id="h1" style="position:relative">Фото- и видеосъёмка</div></div>
  <div class="mask" style="top:504px"><div class="h" id="h2" style="position:relative">запрещена</div></div>
  <div class="layer" id="rule"></div>

  <div class="layer" id="body">Всё, что прозвучит в этом зале,<br>остаётся в этом зале.</div>
  <div class="layer" id="en">Photo and video recording is not permitted</div>

  <div class="layer" id="sign">
    <div class="w">Ветер перемен</div>
    <div class="bar"></div>
    <img id="logo" src="logo/ldb-logo.png" alt="L'Oréal Dermatological Beauty" onerror="this.remove();document.getElementById('ldbtxt').style.display='block'">
    <div class="ldb" id="ldbtxt" style="display:none"><b>L'ORÉAL</b>DERMATOLOGICAL BEAUTY</div>
  </div>
</div>

<script src="wind.js"></script>
<script>
const W = 1920, H = 1080;
const bg = document.getElementById('bg').getContext('2d');
const fx = document.getElementById('fx').getContext('2d');
drawBackground(bg, W, H);

const ribbons = [
  { P: [[1180,1180],[1600,1020],[1720,800],[2060,700]], width: 26, twist: 0.55, twistPhase: -0.4, twistSpeed: 1, flutter: 22, seed: 3.1, silk: 0, deep: '#7f99f2', bright: '#b8c8fa', start: 0.5 },
  { P: [[1020,1200],[1500,980],[1520,560],[2060,420]], width: 40, twist: 0.6, twistPhase: -0.9, twistSpeed: 1, flutter: 30, seed: 1.4, silk: 46, start: 0.25 },
  { P: [[820,1190],[1240,980],[1320,300],[2080,120]], width: 64, twist: 0.65, twistPhase: -1.1, twistSpeed: 1, flutter: 36, seed: 0.2, silk: 64, start: 0 },
];

const $ = id => document.getElementById(id);
const rings = [...document.querySelectorAll('.ring')];
const slashes = [...document.querySelectorAll('.slash')];
const glyphs = [...document.querySelectorAll('.glyph')];

// Таймлайн: интро 0–5 с, удержание (бесшовный луп 5–15 с), аутро 15–18 с.
window.DURATION = 18;
window.LOOP_RANGE = [5, 15];

window.render = function (t) {
  const out = prog(t, 15.2, 2.6); // уход: ветер уносит всё вправо

  fx.clearRect(0, 0, W, H);
  drawGusts(fx, W, H, t, clamp(t / 1.5) * (1 - out));
  ribbons.forEach(r => {
    const grow = easeInOutCubic(prog(t, r.start, 2.4));
    const tail = easeInOutCubic(prog(t, 15 + r.start * 0.6, 2.4));
    drawRibbon(fx, r, t, tail, grow);
  });

  const items = [
    ['kicker', 1.0], ['icons', 1.3], ['rule', 2.4], ['body', 2.8], ['en', 3.1], ['sign', 3.5],
  ];
  items.forEach(([id, st]) => {
    const el = $(id);
    windIn(el, prog(t, st, 1.1));
    if (out > 0) windOut(el, prog(t, 15 + (st - 1) * 0.12, 1.6));
  });
  // линейка растёт по ветру
  $('rule').style.transform += ` scaleX(${easeOutExpo(prog(t, 2.4, 1.0))})`;

  // заголовок — подъём из маски
  [['h1', 1.7], ['h2', 1.95]].forEach(([id, st]) => {
    const el = $(id), k = easeOutExpo(prog(t, st, 1.2));
    el.parentElement.style.overflow = t > 15 ? 'visible' : 'hidden';
    el.style.transform = `translateY(${(1 - k) * 120}%)`;
    el.style.opacity = 1;
    el.style.filter = 'none';
    if (out > 0) windOut(el, prog(t, 15.05 + (id === 'h2' ? 0.08 : 0), 1.6), 160);
  });

  // иконки: круг рисуется, затем перечёркивание
  rings.forEach((r, i) => r.style.strokeDashoffset = 1 - easeOutCubic(prog(t, 1.4 + i * 0.15, 0.9)));
  glyphs.forEach((g, i) => g.style.opacity = easeOutCubic(prog(t, 1.6 + i * 0.15, 0.6)));
  slashes.forEach((s, i) => s.style.strokeDashoffset = 1 - easeOutExpo(prog(t, 2.2 + i * 0.15, 0.7)));
};

window.render(window.location.hash ? parseFloat(window.location.hash.slice(1)) : 6);
</script>
</body>
</html>
